name: Build Windows app
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore PCSetupCopier/PCSetupCopier.csproj
      - name: Build
        run: dotnet build PCSetupCopier/PCSetupCopier.csproj -c Release --no-restore
      - name: Publish (self-contained)
        run: dotnet publish PCSetupCopier/PCSetupCopier.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCSetupCopier-win-x64
          path: publish/
          if-no-files-found: error
